    <title>InsideInvoice — GST Invoice &amp; Billing Software for Indian Businesses</title>
    <link rel="canonical" href="https://www.insideinvoice.com/" />
    <meta property="og:title" content="InsideInvoice — GST Invoice &amp; Billing Software for Indian Businesses" />
    <meta property="og:description" content="Create professional GST invoices and streamline billing with Inside Invoice. Manage products, customers, payments, and business records in one web-based platform." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inside Invoice" />
    <meta property="og:url" content="https://www.insideinvoice.com/" />
    <meta property="og:image" content="https://www.insideinvoice.com/og-image.png" />
    <meta property="og:image:alt" content="Inside Invoice GST invoice and billing software" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InsideInvoice — GST Invoice &amp; Billing Software for Indian Businesses" />
    <meta name="twitter:description" content="Create professional GST invoices and streamline billing with Inside Invoice. Manage products, customers, payments, and business records in one web-based platform." />
    <meta name="twitter:image" content="https://www.insideinvoice.com/og-image.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS 27 tints the status-bar chrome from theme-color: match the light
         app chrome (white strip/header) and keep a dark variant for dark OS. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inside Invoice" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Apply the privacy directive before the React bundle runs. This keeps
      // authenticated and token-based routes out of indexing even when a
      // crawler inspects the initial SPA shell before rendering it.
      (function () {
        var path = window.location.pathname;
        var privateRoute = /^\/(login|forgot-password|change-password)(\/|$)/.test(path) ||
          /^\/(dashboard|business-setup|invoice|invoices|customers|products|delivery-challans|invoice-templates|payments|labels|settings|profile|more|admin|i|video)(\/|$)/.test(path);
        if (!privateRoute) return;
        var robots = document.querySelector('meta[name="robots"]');
        if (robots) robots.setAttribute("content", "noindex,nofollow,noarchive");
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.remove();
        var socialUrl = document.querySelector('meta[property="og:url"]');
        if (socialUrl) socialUrl.remove();
        document.title = "Inside Invoice";
      })();
    </script>
    <style>
      @media (max-width: 767px) { body { -webkit-tap-highlight-color: transparent; } }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (reg) { reg.unregister(); });
        });
      }
      if ("caches" in window) {
        caches.keys().then(function (names) {
          names.forEach(function (name) { caches.delete(name); });
        });
      }
    </script>
    <script>
      // iOS 27 (installed home-screen apps only) paints a system
      // backdrop-blur over the top of the PWA that feathers ~20px BELOW
      // env(safe-area-inset-top), fogging any header text in that zone.
      // Safari tabs, browsers, Android and desktop PWAs are unaffected.
      // The blur feather is a constant extension past the safe-area inset,
      // so the answer is simply "inset + feather" — no measurement needed.
      // (Older probe-based approach double-counted the inset: ~140px of
      // dead space.) 10px keeps the top tight while still sampling solid
      // color; raise it (e.g. 20–24px) if the iOS blur ever fogs the nav.
      (function () {
        var isIOS =
          /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isStandalone =
          navigator.standalone === true ||
          (window.matchMedia &&
            window.matchMedia("(display-mode: standalone)").matches);
        if (!isIOS || !isStandalone) return;
        document.documentElement.style.setProperty(
          "--status-bar-blur-gap",
          "10px"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
