[[redirects]]
  from = "https://insideinvoice.in/*"
  to = "https://www.insideinvoice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.insideinvoice.in/*"
  to = "https://www.insideinvoice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://insideinvoice.com/*"
  to = "https://www.insideinvoice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/i/*"
  to = "/i/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/favicon.ico"
[headers.values]
  Content-Type = "image/x-icon"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/favicon-*.png"
[headers.values]
  Content-Type = "image/png"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/apple-touch-icon.png"
[headers.values]
  Content-Type = "image/png"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/favicon.svg"
[headers.values]
  Content-Type = "image/svg+xml"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/og-image.png"
[headers.values]
  Content-Type = "image/png"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sitemap.xml"
[headers.values]
  Content-Type = "application/xml; charset=UTF-8"
  Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/robots.txt"
[headers.values]
  Content-Type = "text/plain; charset=UTF-8"
  Cache-Control = "public, max-age=3600, must-revalidate"
