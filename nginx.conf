server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # These crawler/brand resources must never be served by the SPA fallback.
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }

    # Token share pages use a prerendered noindex shell while React still
    # receives the original /i/<token> URL and renders the invoice normally.
    location /i/ {
        try_files $uri $uri/ /i/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
